<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <defs>
    <!-- Gold Metallic Gradients -->
    <linearGradient id="goldOuterRing" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#f3cb55" />
      <stop offset="25%" stopColor="#d4a034" />
      <stop offset="50%" stopColor="#fae082" />
      <stop offset="75%" stopColor="#be8a21" />
      <stop offset="100%" stopColor="#e5b542" />
    </linearGradient>

    <linearGradient id="goldInnerRing" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stopColor="#fae288" />
      <stop offset="50%" stopColor="#cf9a2d" />
      <stop offset="100%" stopColor="#9c6d15" />
    </linearGradient>

    <linearGradient id="goldTextGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stopColor="#fae48e" />
      <stop offset="50%" stopColor="#dfa732" />
      <stop offset="100%" stopColor="#fae48e" />
    </linearGradient>

    <linearGradient id="shieldGoldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#ffd868" />
      <stop offset="35%" stopColor="#d4a132" />
      <stop offset="70%" stopColor="#aa791b" />
      <stop offset="100%" stopColor="#e8bb47" />
    </linearGradient>

    <!-- Deep Red Stripes Gradient -->
    <linearGradient id="redStripeGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stopColor="#b51a28" />
      <stop offset="50%" stopColor="#8d0f1b" />
      <stop offset="100%" stopColor="#67050f" />
    </linearGradient>

    <!-- Green Leaves Gradient -->
    <linearGradient id="leafGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#2e7d32" />
      <stop offset="50%" stopColor="#1b5e20" />
      <stop offset="100%" stopColor="#0d3c12" />
    </linearGradient>

    <!-- Ball 3D Shading -->
    <radialGradient id="ballShading" cx="40%" cy="38%" r="60%">
      <stop offset="0%" stopColor="#fff099" />
      <stop offset="45%" stopColor="#dfa832" />
      <stop offset="85%" stopColor="#9e7218" />
      <stop offset="100%" stopColor="#684a0d" />
    </radialGradient>

    <!-- Text Curved Paths -->
    <!-- Top Arc for AL-RAJAA (from 215deg to 325deg, left to right clockwise) -->
    <path id="topArc" d="M 85,300 A 215,215 0 1,1 515,300" fill="none" />
    
    <!-- Bottom Arc for FOOTBALL CLUB (from right to left along bottom, so text reads upright) -->
    <path id="bottomArc" d="M 505,300 A 205,205 0 0,1 95,300" fill="none" />

    <!-- Clip Path for Shield Interior Stripes -->
    <clipPath id="shieldInnerClip">
      <path d="M 200,165 
               Q 250,158 300,158 
               Q 350,158 400,165 
               C 388,245 375,340 300,435 
               C 225,340 212,245 200,165 Z" />
    </clipPath>

    <!-- Subtle Drop Shadow -->
    <filter id="logoShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.6" />
    </filter>
  </defs>

  <!-- Group with shadow -->
  <g filter="url(#logoShadow)">
    <!-- 1. Outer Dark Circular Body (Transparent outside this circle!) -->
    <circle cx="300" cy="300" r="275" fill="#08080a" />

    <!-- 2. Outer Gold Rims -->
    <circle cx="300" cy="300" r="274" fill="none" stroke="url(#goldOuterRing)" stroke-width="7" />
    <circle cx="300" cy="300" r="265" fill="none" stroke="url(#goldInnerRing)" stroke-width="2" opacity="0.8" />

    <!-- 3. Inner Gold Dividing Rim -->
    <circle cx="300" cy="300" r="172" fill="none" stroke="url(#goldOuterRing)" stroke-width="5" />
    <circle cx="300" cy="300" r="166" fill="none" stroke="url(#goldInnerRing)" stroke-width="2" opacity="0.7" />

    <!-- 4. Inner Circular Field Behind Shield -->
    <circle cx="300" cy="300" r="164" fill="#0a0b0d" />

    <!-- 5. Top Curved Text: AL-RAJAA -->
    <text fill="url(#goldTextGrad)" font-size="52" font-family="'Times New Roman', 'Cinzel', 'Georgia', serif" font-weight="900" letter-spacing="7">
      <textPath href="#topArc" startOffset="50%" text-anchor="middle">
        AL-RAJAA
      </textPath>
    </text>

    <!-- 6. Bottom Curved Text: FOOTBALL CLUB -->
    <text fill="url(#goldTextGrad)" font-size="37" font-family="'Times New Roman', 'Cinzel', 'Georgia', serif" font-weight="900" letter-spacing="5">
      <textPath href="#bottomArc" startOffset="50%" text-anchor="middle">
        FOOTBALL CLUB
      </textPath>
    </text>

    <!-- 7. Flanking Golden Stars (at 9 o'clock and 3 o'clock) -->
    <!-- Left Star -->
    <polygon points="85,300 93,293 96,282 101,291 112,291 104,298 107,309 98,303 90,309 92,298" 
             fill="url(#goldTextGrad)" stroke="#aa791b" stroke-width="0.8"
             transform="rotate(-90 98 298) translate(-10 -2)" />
    
    <!-- Right Star -->
    <polygon points="515,300 523,293 526,282 531,291 542,291 534,298 537,309 528,303 520,309 522,298" 
             fill="url(#goldTextGrad)" stroke="#aa791b" stroke-width="0.8"
             transform="rotate(90 528 298) translate(10 -2)" />

    <!-- ============================================== -->
    <!-- 8. CENTRAL SHIELD                             -->
    <!-- ============================================== -->

    <!-- Outer Gold Heraldic Shield Body -->
    <!-- Decorative wings at top corners, graceful curve down to bottom sharp tip -->
    <path d="M 188,150 
             C 210,158 250,150 300,150 
             C 350,150 390,158 412,150 
             C 416,168 408,215 398,255 
             C 382,320 350,390 300,448 
             C 250,390 218,320 202,255 
             C 192,215 184,168 188,150 Z" 
          fill="url(#shieldGoldGrad)" 
          stroke="#ffe688" 
          stroke-width="3" />

    <!-- Shield Interior Relief Line -->
    <path d="M 196,160 
             C 220,166 255,160 300,160 
             C 345,160 380,166 404,160 
             C 408,175 400,218 391,255 
             C 376,316 345,380 300,434 
             C 255,380 224,316 209,255 
             C 200,218 192,175 196,160 Z" 
          fill="#111" 
          stroke="url(#goldOuterRing)" 
          stroke-width="2" />

    <!-- Shield Clipped Vertical Stripes (Catalan/Iraqi Club Gold & Red Stripes) -->
    <g clip-path="url(#shieldInnerClip)">
      <!-- Base Gold Field -->
      <rect x="180" y="140" width="240" height="310" fill="url(#shieldGoldGrad)" />

      <!-- Red Stripe 1 (Left-Center) -->
      <rect x="226" y="140" width="46" height="310" fill="url(#redStripeGrad)" stroke="#50030a" stroke-width="1.5" />

      <!-- Center Gold Stripe: x=272 to x=328 (width 56) -->

      <!-- Red Stripe 2 (Right-Center) -->
      <rect x="328" y="140" width="46" height="310" fill="url(#redStripeGrad)" stroke="#50030a" stroke-width="1.5" />
    </g>

    <!-- Inner Shield Border Overlay -->
    <path d="M 200,165 
             Q 250,158 300,158 
             Q 350,158 400,165 
             C 388,245 375,340 300,435 
             C 225,340 212,245 200,165 Z" 
          fill="none" 
          stroke="url(#goldInnerRing)" 
          stroke-width="4" />

    <!-- ============================================== -->
    <!-- 9. LAUREL WREATH (غار النصر الأخضر مع أوردة ذهبية) -->
    <!-- ============================================== -->
    <g id="laurelWreath">
      <!-- Left Laurel Branch -->
      <g id="leftBranch">
        <!-- Main stem curve -->
        <path d="M 300,380 C 240,375 205,320 205,250 C 205,200 235,160 250,145" 
              fill="none" stroke="url(#goldOuterRing)" stroke-width="3" stroke-linecap="round" />

        <!-- Leaf pairs along left branch -->
        <!-- Pair 1 (Bottom) -->
        <path d="M 285,372 C 265,378 250,370 245,360 C 255,355 275,360 285,372 Z" fill="url(#leafGrad)" stroke="#e5b542" stroke-width="1.5" />
        <path d="M 270,360 C 250,362 235,350 232,340 C 244,338 260,345 270,360 Z" fill="url(#leafGrad)" stroke="#e5b542" stroke-width="1.5" />

        <!-- Pair 2 (Lower Mid) -->
        <path d="M 248,345 C 228,345 212,330 210,318 C 222,318 238,328 248,345 Z" fill="url(#leafGrad)" stroke="#e5b542" stroke-width="1.5" />
        <path d="M 235,325 C 215,320 202,305 200,290 C 212,292 228,305 235,325 Z" fill="url(#leafGrad)" stroke="#e5b542" stroke-width="1.5" />

        <!-- Pair 3 (Mid) -->
        <path d="M 224,300 C 204,290 195,272 195,258 C 208,262 220,278 224,300 Z" fill="url(#leafGrad)" stroke="#e5b542" stroke-width="1.5" />
        <path d="M 218,270 C 200,258 194,238 196,224 C 208,230 218,248 218,270 Z" fill="url(#leafGrad)" stroke="#e5b542" stroke-width="1.5" />

        <!-- Pair 4 (Upper Mid) -->
        <path d="M 218,240 C 204,224 202,204 206,190 C 217,198 222,218 218,240 Z" fill="url(#leafGrad)" stroke="#e5b542" stroke-width="1.5" />
        <path d="M 224,210 C 214,192 216,174 224,162 C 232,172 232,192 224,210 Z" fill="url(#leafGrad)" stroke="#e5b542" stroke-width="1.5" />

        <!-- Pair 5 (Top tip) -->
        <path d="M 235,180 C 230,162 238,146 248,138 C 252,150 248,168 235,180 Z" fill="url(#leafGrad)" stroke="#e5b542" stroke-width="1.5" />
      </g>

      <!-- Right Laurel Branch (Mirrored) -->
      <g id="rightBranch" transform="translate(600, 0) scale(-1, 1)">
        <!-- Main stem curve -->
        <path d="M 300,380 C 240,375 205,320 205,250 C 205,200 235,160 250,145" 
              fill="none" stroke="url(#goldOuterRing)" stroke-width="3" stroke-linecap="round" />

        <!-- Leaf pairs along right branch -->
        <path d="M 285,372 C 265,378 250,370 245,360 C 255,355 275,360 285,372 Z" fill="url(#leafGrad)" stroke="#e5b542" stroke-width="1.5" />
        <path d="M 270,360 C 250,362 235,350 232,340 C 244,338 260,345 270,360 Z" fill="url(#leafGrad)" stroke="#e5b542" stroke-width="1.5" />

        <path d="M 248,345 C 228,345 212,330 210,318 C 222,318 238,328 248,345 Z" fill="url(#leafGrad)" stroke="#e5b542" stroke-width="1.5" />
        <path d="M 235,325 C 215,320 202,305 200,290 C 212,292 228,305 235,325 Z" fill="url(#leafGrad)" stroke="#e5b542" stroke-width="1.5" />

        <path d="M 224,300 C 204,290 195,272 195,258 C 208,262 220,278 224,300 Z" fill="url(#leafGrad)" stroke="#e5b542" stroke-width="1.5" />
        <path d="M 218,270 C 200,258 194,238 196,224 C 208,230 218,248 218,270 Z" fill="url(#leafGrad)" stroke="#e5b542" stroke-width="1.5" />

        <path d="M 218,240 C 204,224 202,204 206,190 C 217,198 222,218 218,240 Z" fill="url(#leafGrad)" stroke="#e5b542" stroke-width="1.5" />
        <path d="M 224,210 C 214,192 216,174 224,162 C 232,172 232,192 224,210 Z" fill="url(#leafGrad)" stroke="#e5b542" stroke-width="1.5" />

        <path d="M 235,180 C 230,162 238,146 248,138 C 252,150 248,168 235,180 Z" fill="url(#leafGrad)" stroke="#e5b542" stroke-width="1.5" />
      </g>

      <!-- Center Ribbon Tie at Bottom of Laurel Wreath -->
      <path d="M 292,374 C 296,370 304,370 308,374 C 314,380 306,388 300,392 C 294,388 286,380 292,374 Z" 
            fill="url(#goldOuterRing)" stroke="#9c6d15" stroke-width="1.5" />
    </g>

    <!-- ============================================== -->
    <!-- 10. SOCCER BALL (كرة القدم الذهبية والخضراء)  -->
    <!-- ============================================== -->
    <g id="soccerBall">
      <!-- Ball Outer Ring & Shadow -->
      <circle cx="300" cy="226" r="56" fill="url(#ballShading)" stroke="url(#goldOuterRing)" stroke-width="3.5" />

      <!-- Outer Ball Contour Line -->
      <circle cx="300" cy="226" r="54" fill="none" stroke="#684a0d" stroke-width="1" opacity="0.6" />

      <!-- Center Pentagon (Green/Dark) -->
      <polygon points="300,207 318,220 311,241 289,241 282,220" 
               fill="#0d3b14" stroke="url(#goldOuterRing)" stroke-width="2.5" />

      <!-- Seam Lines radiating from Center Pentagon -->
      <!-- Top vertex (300, 207) to top (300, 172) -->
      <line x1="300" y1="207" x2="300" y2="173" stroke="url(#goldOuterRing)" stroke-width="2.5" />

      <!-- Top Right vertex (318, 220) to edge (348, 206) -->
      <line x1="318" y1="220" x2="348" y2="206" stroke="url(#goldOuterRing)" stroke-width="2.5" />

      <!-- Bottom Right vertex (311, 241) to edge (338, 266) -->
      <line x1="311" y1="241" x2="338" y2="266" stroke="url(#goldOuterRing)" stroke-width="2.5" />

      <!-- Bottom Left vertex (289, 241) to edge (262, 266) -->
      <line x1="289" y1="241" x2="262" y2="266" stroke="url(#goldOuterRing)" stroke-width="2.5" />

      <!-- Top Left vertex (282, 220) to edge (252, 206) -->
      <line x1="282" y1="220" x2="252" y2="206" stroke="url(#goldOuterRing)" stroke-width="2.5" />

      <!-- Surrounding Peripheral Dark Green Patches -->
      <!-- Top Patch -->
      <polygon points="300,173 324,180 338,172 300,170 262,172 276,180" 
               fill="#0d3b14" stroke="url(#goldOuterRing)" stroke-width="2" />

      <!-- Top Right Patch -->
      <polygon points="348,206 354,228 356,212 344,192 334,184 340,196" 
               fill="#0d3b14" stroke="url(#goldOuterRing)" stroke-width="2" />

      <!-- Bottom Right Patch -->
      <polygon points="338,266 324,278 344,274 353,254 346,244" 
               fill="#0d3b14" stroke="url(#goldOuterRing)" stroke-width="2" />

      <!-- Bottom Left Patch -->
      <polygon points="262,266 276,278 256,274 247,254 254,244" 
               fill="#0d3b14" stroke="url(#goldOuterRing)" stroke-width="2" />

      <!-- Top Left Patch -->
      <polygon points="252,206 246,228 244,212 256,192 266,184 260,196" 
               fill="#0d3b14" stroke="url(#goldOuterRing)" stroke-width="2" />

      <!-- Hexagonal Gold Facets inner stitch accents -->
      <line x1="300" y1="173" x2="324" y2="180" stroke="url(#goldOuterRing)" stroke-width="2" />
      <line x1="324" y1="180" x2="348" y2="206" stroke="url(#goldOuterRing)" stroke-width="2" />
      <line x1="348" y1="206" x2="354" y2="242" stroke="url(#goldOuterRing)" stroke-width="2" />
      <line x1="354" y1="242" x2="338" y2="266" stroke="url(#goldOuterRing)" stroke-width="2" />
      <line x1="338" y1="266" x2="300" y2="282" stroke="url(#goldOuterRing)" stroke-width="2" />
      <line x1="300" y1="282" x2="262" y2="266" stroke="url(#goldOuterRing)" stroke-width="2" />
      <line x1="262" y1="266" x2="246" y2="242" stroke="url(#goldOuterRing)" stroke-width="2" />
      <line x1="246" y1="242" x2="252" y2="206" stroke="url(#goldOuterRing)" stroke-width="2" />
      <line x1="252" y1="206" x2="276" y2="180" stroke="url(#goldOuterRing)" stroke-width="2" />
      <line x1="276" y1="180" x2="300" y2="173" stroke="url(#goldOuterRing)" stroke-width="2" />
    </g>

    <!-- Top Gloss / Rim Highlights -->
    <ellipse cx="300" cy="180" rx="90" ry="12" fill="url(#goldInnerRing)" opacity="0.3" />
  </g>
</svg>
